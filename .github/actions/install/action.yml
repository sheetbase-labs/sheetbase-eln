name: Install dependencies
description: >-
  Install node dependencies. The @sheetbase-labs packages are built from the
  public sheetbase-components repository and linked in, because GitHub Packages
  needs a token that the workflow token cannot always read. node_modules itself
  and the built components checkout are cached between runs.
inputs:
  components-ref:
    description: Branch or tag of sheetbase-components to build
    default: main
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.9.0
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    # Keep in step with mise.toml: bun fmt and bun check run the format and
    # type checks.
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4
    - name: Find the component packages revision
      id: components
      shell: bash
      run: |
        sha="$(git ls-remote https://github.com/sheetbase-labs/sheetbase-components "${{ inputs.components-ref }}" | cut -f1 | head -n1)"
        echo "sha=${sha:-unknown}" >> "$GITHUB_OUTPUT"
        echo "dir=$(realpath -m "$GITHUB_WORKSPACE/../sheetbase-components")" >> "$GITHUB_OUTPUT"
    - name: Restore the built component packages
      id: components-cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.components.outputs.dir }}
        key: components-${{ runner.os }}-${{ steps.components.outputs.sha }}
    - name: Fetch the component packages
      if: steps.components-cache.outputs.cache-hit != 'true'
      shell: bash
      run: >-
        git clone --depth 1 --branch "${{ inputs.components-ref }}"
        https://github.com/sheetbase-labs/sheetbase-components
        "${{ steps.components.outputs.dir }}"
    - name: Build the component packages
      if: steps.components-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ steps.components.outputs.dir }}
      run: bun install --frozen-lockfile && bun run build:lib
    - name: Link the component packages
      shell: bash
      run: node scripts/railway-link-components.mjs "${{ steps.components.outputs.dir }}/packages"
    # node_modules itself, not the package store: restoring it and letting
    # pnpm confirm it matches the lockfile is a few seconds, where installing
    # from the store took most of the step. A partial match (an older
    # lockfile) still restores, and pnpm installs only the difference.
    - name: Restore node_modules
      id: node-modules
      uses: actions/cache/restore@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('.node-version') }}-${{ steps.components.outputs.sha }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
        restore-keys: node-modules-${{ runner.os }}-${{ hashFiles('.node-version') }}-
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
    # Saved at once rather than when the job ends, so a run cancelled by a
    # newer push still leaves it for the next.
    - name: Save node_modules
      if: steps.node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('.node-version') }}-${{ steps.components.outputs.sha }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
    - name: Share one copy of React with the components
      shell: bash
      run: |
        for pkg in react react-dom; do
          rm -rf "${{ steps.components.outputs.dir }}/node_modules/$pkg"
          ln -s "$PWD/node_modules/$pkg" "${{ steps.components.outputs.dir }}/node_modules/$pkg"
        done
    # The route tree, the public OpenAPI contract and the Python SDK's generated
    # layer are derived from source and not committed, so no two PRs conflict on
    # them. Every job gets them here.
    - name: Generate derived files
      shell: bash
      run: pnpm generate
