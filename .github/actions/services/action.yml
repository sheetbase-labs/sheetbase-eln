name: Disposable services
description: >-
  Start a disposable Postgres and PostgREST under Docker Compose. The test
  layers that talk to the database from the runner also need PostgreSQL 18
  binaries and a PostgREST binary on the host, and the pipeline tests need
  Python; the browser journeys need none of those.
inputs:
  host-tools:
    description: Install PostgreSQL 18 and PostgREST binaries on the runner
    default: 'true'
  python:
    description: Install the Python used by pipeline acceptance
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      if: inputs.python == 'true'
      with:
        python-version: '3.12'
    # The database image compiles pgvector, the slowest part of starting the
    # services (about 19s). It is cached under its Dockerfile and the month, so
    # the base image is still refreshed monthly.
    - name: Find the database image key
      id: db-image
      shell: bash
      run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
    - name: Restore the database image
      id: db-image-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/sheetbase-postgres.tar
        key: db-image-${{ runner.os }}-${{ steps.db-image.outputs.month }}-${{ hashFiles('docker/db/**') }}
    - name: Load the database image
      if: steps.db-image-cache.outputs.cache-hit == 'true'
      shell: bash
      run: docker load --input ~/sheetbase-postgres.tar
    - name: Start the compose services
      shell: bash
      run: |
        cp .env.example .env.local
        cp .env.local .env.ci-compose
        # Build and pull while the host tools install. The services start only
        # afterwards, because installing the PostgreSQL package starts a host
        # cluster on 5432 until it is stopped.
        docker compose --env-file .env.ci-compose build postgrest &
        build=$!
        if [ "${{ steps.db-image-cache.outputs.cache-hit }}" = "true" ]; then
          true &
        else
          docker compose --env-file .env.ci-compose build postgres &
        fi
        pull=$!
        if [ "${{ inputs.host-tools }}" = "true" ]; then
          sudo apt-get update
          sudo apt-get install -y postgresql-common curl ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-client-18 postgresql-18-pgvector
          # The migrator is not a superuser, so the extension must be trusted
          # (the docker/db image does the same).
          echo 'trusted = true' | sudo tee -a /usr/share/postgresql/18/extension/vector.control
          sudo systemctl stop postgresql
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
          curl -fL https://github.com/PostgREST/postgrest/releases/download/v14.5/postgrest-v14.5-linux-static-x86-64.tar.xz -o /tmp/postgrest.tar.xz
          tar -xJf /tmp/postgrest.tar.xz -C /tmp
          sudo install -m 0755 /tmp/postgrest /usr/local/bin/postgrest
        fi
        if [ "${{ inputs.python }}" = "true" ]; then
          python -m pip install uv
          uv venv /tmp/sheetbase-acceptance-python
          uv pip install --python /tmp/sheetbase-acceptance-python/bin/python pandas numpy
          echo 'PIPELINE_ACCEPTANCE_PYTHON=/tmp/sheetbase-acceptance-python/bin/python' >> "$GITHUB_ENV"
        fi
        wait "$build"
        wait "$pull"
        docker compose --env-file .env.ci-compose up -d --wait postgres postgrest
        sed -i 's/@postgres:5432/@localhost:5432/' .env.local
    # Saved once the services are up, so a run that later fails still leaves it.
    - name: Export the database image
      if: steps.db-image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: docker save --output ~/sheetbase-postgres.tar sheetbase-postgres:18
    - name: Save the database image
      if: steps.db-image-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/sheetbase-postgres.tar
        key: db-image-${{ runner.os }}-${{ steps.db-image.outputs.month }}-${{ hashFiles('docker/db/**') }}
