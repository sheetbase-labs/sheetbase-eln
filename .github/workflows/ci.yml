name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Format, lint and typecheck
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://sheetbase:sheetbase-ci@localhost:5432/sheetbase
      FORMULA_DATABASE_URL: postgresql://formula_runtime:sheetbase-ci@localhost:5432/sheetbase
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-value-32-chars-min
      PGRST_JWT_SECRET: ci-only-placeholder-secret-value-32-chars-min
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: GitHub Packages auth
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm typecheck

  acceptance:
    name: Tests, build and scientific workflow
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHEETBASE_DEV_AUTH_FREE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: GitHub Packages auth
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acceptance runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common curl ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-client-18
          sudo systemctl stop postgresql
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
          curl -fL https://github.com/PostgREST/postgrest/releases/download/v14.5/postgrest-v14.5-linux-static-x86-64.tar.xz -o /tmp/postgrest.tar.xz
          tar -xJf /tmp/postgrest.tar.xz -C /tmp
          sudo install -m 0755 /tmp/postgrest /usr/local/bin/postgrest
          python -m pip install uv
          uv venv /tmp/sheetbase-acceptance-python
          uv pip install --python /tmp/sheetbase-acceptance-python/bin/python pandas numpy
          echo 'PIPELINE_ACCEPTANCE_PYTHON=/tmp/sheetbase-acceptance-python/bin/python' >> "$GITHUB_ENV"
      - name: Prepare disposable services
        run: |
          cp .env.example .env.local
          cp .env.local .env.ci-compose
          docker compose --env-file .env.ci-compose up -d --build --wait postgres postgrest
          sed -i 's/@postgres:5432/@localhost:5432/' .env.local
      - name: Unit and component tests
        run: pnpm test --maxWorkers=4
      - name: Database contract tests
        run: pnpm test:db --maxWorkers=2
      - name: API acceptance on isolated databases
        run: pnpm test:api
      - name: Migrate and seed the acceptance workspace
        run: |
          pnpm db:migrate
          pnpm db:seed:design
          docker compose --env-file .env.ci-compose restart postgrest
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3002/ready; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3002/ready
      - name: Production build
        run: pnpm build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Complete scientific workflow
        run: pnpm exec playwright test tests/browser/journeys/complete-scientific-workflow.test.ts --project=browser --workers=1
      - name: Native signing acceptance
        run: pnpm exec playwright test --config playwright.signatures.config.ts --workers=1
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-workflow-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Service diagnostics
        if: failure()
        run: docker compose --env-file .env.ci-compose logs --no-color --tail=100
      - name: Remove disposable services
        if: always()
        run: docker compose --env-file .env.ci-compose down -v
