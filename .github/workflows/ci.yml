name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Format, lint and typecheck
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://sheetbase:sheetbase-ci@localhost:5432/sheetbase
      FORMULA_DATABASE_URL: postgresql://formula_runtime:sheetbase-ci@localhost:5432/sheetbase
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-value-32-chars-min
      PGRST_JWT_SECRET: ci-only-placeholder-secret-value-32-chars-min
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: GitHub Packages auth
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm typecheck

  acceptance:
    name: Tests, build and scientific workflow
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHEETBASE_DEV_AUTH_FREE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: GitHub Packages auth
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
      - run: pnpm install --frozen-lockfile
      - name: Prepare disposable services
        run: |
          cp .env.example .env.local
          cp .env.local .env.ci-compose
          docker compose --env-file .env.ci-compose up -d --build --wait postgres postgrest
          sed -i 's/@postgres:5432/@localhost:5432/' .env.local
      - name: Unit and component tests
        run: pnpm test --maxWorkers=4
      - name: Database contract tests
        run: pnpm test:db --maxWorkers=4
      - name: Migrate and seed the acceptance workspace
        run: |
          pnpm db:migrate
          pnpm db:seed:design
          docker compose --env-file .env.ci-compose restart postgrest
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3002/ready; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3002/ready
      - name: Production build
        run: pnpm build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Complete scientific workflow
        run: pnpm exec playwright test tests/browser/journeys/complete-scientific-workflow.test.ts --project=browser --workers=1
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-workflow-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Service diagnostics
        if: failure()
        run: docker compose --env-file .env.ci-compose logs --no-color --tail=100
      - name: Remove disposable services
        if: always()
        run: docker compose --env-file .env.ci-compose down -v
