name: CI

on:
  pull_request:
  # GitHub's merge queue tests each PR on top of main plus the PRs ahead of it,
  # so a PR never has to be rebased by hand just because another one merged.
  # The required checks must run for this event too or the queue waits forever.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: pnpm check
          - name: Lint
            command: pnpm lint
          - name: Typecheck
            command: pnpm typecheck
    env:
      DATABASE_URL: postgresql://sheetbase:sheetbase-ci@localhost:5432/sheetbase
      FORMULA_DATABASE_URL: postgresql://formula_runtime:sheetbase-ci@localhost:5432/sheetbase
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-value-32-chars-min
      PGRST_JWT_SECRET: ci-only-placeholder-secret-value-32-chars-min
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - run: ${{ matrix.command }}

  # Migration names must be timestamped, and a migration that sorts before one
  # already on main is only a problem when the two touch the same table,
  # function or view (a database that has moved past it would apply it late).
  # Unrelated ones merge in any order. Needs no install: it only reads git.
  migration-order:
    name: Migration order
    # Only meaningful with a base to compare against; a push to main has none.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Check against the base branch
        env:
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: node scripts/check-migrations.mjs "$BASE"

  unit:
    name: Unit and component tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - run: cp .env.example .env.local
      - run: pnpm test --shard=${{ matrix.shard }}

  database:
    name: Database contract tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - uses: ./.github/actions/services
        with:
          python: 'true'
      - run: pnpm test:db --maxWorkers=2 --shard=${{ matrix.shard }}
      - name: Service diagnostics
        if: failure()
        run: docker compose --env-file .env.ci-compose logs --no-color --tail=100
      - name: Remove disposable services
        if: always()
        run: docker compose --env-file .env.ci-compose down -v

  api:
    name: API acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - uses: ./.github/actions/services
      - run: pnpm test:api
      - name: Service diagnostics
        if: failure()
        run: docker compose --env-file .env.ci-compose logs --no-color --tail=100
      - name: Remove disposable services
        if: always()
        run: docker compose --env-file .env.ci-compose down -v

  # The Python SDK's typed layer is generated from the OpenAPI contract, which
  # is itself generated from src/lib/public-api-*. Neither is committed: the
  # install action generates both, so a new public endpoint always reaches the
  # SDK without a file for two PRs to conflict on.
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - uses: astral-sh/setup-uv@v6
      - name: The contract and the generated layer are in place
        run: |
          test -s docs/api/openapi/external-api-v0.json
          test -s sdks/python/src/sheetbase/_generated/rpc.py
      - name: Tests (Python 3.10)
        working-directory: sdks/python
        run: >-
          uv run --python 3.10 --with pandas,httpx,pytest,respx,pytest-asyncio
          --with-editable . python -m pytest -q
      - name: Tests (Python 3.13)
        working-directory: sdks/python
        run: >-
          uv run --python 3.13 --with pandas,httpx,pytest,respx,pytest-asyncio
          --with-editable . python -m pytest -q
      - name: Types of the generated layer
        working-directory: sdks/python
        run: >-
          uv run --python 3.12 --with pandas,httpx,mypy
          --with-editable . mypy --strict
          src/sheetbase/_generated src/sheetbase/_tables.py src/sheetbase/_unset.py

  # The plugin author's SDK and command (`sheetbase-plugin`). It shares its
  # package rules with the app through sdks/plugin-python/tests/package_cases.json.
  plugin-sdk:
    name: Plugin SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests (Python 3.10)
        working-directory: sdks/plugin-python
        run: uv run --python 3.10 --with pytest --with pandas --with-editable . python -m pytest -q
      - name: Tests (Python 3.13)
        working-directory: sdks/plugin-python
        run: uv run --python 3.13 --with pytest --with pandas --with-editable . python -m pytest -q
      - name: Chemistry plugin tests
        run: uv run --python 3.12 --with pytest --with rdkit python -m pytest -q plugins/chemistry/tests

  # The Python plugin sandbox on a real Docker daemon: the worker and runner
  # images build, a plugin's packages (RDKit) install into their own image, and
  # real calls show the limits are applied, the egress proxy lets a declared
  # host through and nothing else, and the package works. The unit tests drive
  # the same code against stand-ins; this is the only job that runs it for real.
  python-sandbox:
    name: Python plugin sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/pipeline-python-docker-check.mjs

  acceptance:
    name: Browser journeys (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: scientific workflow
            files: tests/browser/journeys/complete-scientific-workflow.test.ts
          - name: analysis and notebook
            files: >-
              tests/browser/journeys/analysis.test.ts
              tests/browser/journeys/notebook-keys.test.ts
          - name: workspace panes
            files: tests/browser/workspace-panes.test.ts
          # Two browsers typing in one notebook block through the bundled
          # co-editing server.
          - name: live co-editing
            files: tests/browser/collab-01-co-editing.test.ts
          # iPhone size, installed-app safe areas and a simulated keyboard:
          # every menu, popover and sheet must open where it can be seen.
          # Two jobs: the whole folder ran about 11 minutes in one job, twice
          # as long as any other journey job.
          - name: phone pages
            files: tests/browser/phone/pages.test.ts
          - name: phone slash menu
            files: tests/browser/phone/slash-menu.test.ts
    env:
      SHEETBASE_DEV_AUTH_FREE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - uses: ./.github/actions/services
        with:
          host-tools: 'false'
      - name: Migrate and seed the acceptance workspace
        run: |
          pnpm db:migrate
          pnpm db:seed:design
          docker compose --env-file .env.ci-compose restart postgrest
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3002/ready; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3002/ready
      - name: Production build
        run: pnpm build
      - name: Find the Playwright version
        id: playwright
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('node_modules/playwright/package.json', 'utf8')).version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The browser's system libraries come to about 22 MB, mostly fonts, and
      # the runner's apt mirror sometimes serves them at 40 kB/s, which took
      # 9 to 15 minutes. Keep the downloaded packages between runs. (Timeouts
      # do not help: the mirror is slow, not stalled.)
      - name: Restore the browser's system packages
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-playwright-${{ runner.os }}-${{ env.ImageVersion }}-${{ steps.playwright.outputs.version }}
      - name: Point apt at the cached packages
        run: |
          mkdir -p ~/apt-debs/partial
          printf 'Dir::Cache::archives "%s/apt-debs";\n' "$HOME" | sudo tee /etc/apt/apt.conf.d/99-cached-debs
      - name: Install browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install browser system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Browser journeys
        run: >-
          pnpm exec playwright test ${{ matrix.files }}
          --project=browser --workers=1
      # Off until tests/browser/rev-03-signing.test.ts is rewritten for the
      # redesigned review screens: it still looks for the old Approve button
      # and witness picker, so it fails on main for reasons unrelated to CI.
      # - name: Native signing acceptance
      #   run: pnpm exec playwright test --config playwright.signatures.config.ts --workers=1
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Service diagnostics
        if: failure()
        run: docker compose --env-file .env.ci-compose logs --no-color --tail=100
      - name: Remove disposable services
        if: always()
        run: docker compose --env-file .env.ci-compose down -v

  # One stable check for the sharded browser journeys.
  acceptance-result:
    name: Build and scientific workflow
    if: always()
    needs: acceptance
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.acceptance.result }}" = "success"
