# Continuous integration: the merge gate made visible.
#
# Runs the repository's own quality gates (see AGENTS.md `pnpm validate`):
# formatting, lint, typecheck, unit tests, database integration tests and a
# production build. Database tests run against a postgres:18-alpine service
# with the same role skeleton Compose provisions locally (migrator owns
# migrations, authenticator fronts PostgREST); each suite rebuilds its own
# disposable test database from drizzle files.
#
# Triggers on pull requests (all branches) and pushes to main. Browser
# (Playwright) and API suites stay manual: they need a running server plus
# seeded services and are too heavy/flaky for per-PR runs.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs for debugging CI itself (branch selectable in the UI/API).
  workflow_dispatch:
permissions:
  contents: read

env:
  # Non-secret placeholders so server-env validation passes at import and
  # build time (mirrors deploy.yml verify). Unit tests mock or override
  # whatever they actually exercise.
  DATABASE_URL: postgresql://sheetbase:sheetbase-ci@localhost:5432/sheetbase
  FORMULA_DATABASE_URL: postgresql://formula_runtime:sheetbase-ci@localhost:5432/sheetbase
  PGRST_DB_URI: postgresql://authenticator:sheetbase-ci@localhost:5432/sheetbase
  BETTER_AUTH_SECRET: ci-only-placeholder-secret-value-32-chars-min
  PGRST_JWT_SECRET: ci-only-placeholder-secret-value-32-chars-min

jobs:
  static:
    name: Format, lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  db:
    name: Database integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sheetbase
          POSTGRES_PASSWORD: sheetbase-ci
          POSTGRES_DB: sheetbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sheetbase"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://sheetbase:sheetbase-ci@localhost:5432/sheetbase
      MIGRATION_DATABASE_URL: postgresql://migrator:sheetbase-ci@localhost:5432/sheetbase
      PGRST_DB_URI: postgresql://authenticator:sheetbase-ci@localhost:5432/sheetbase
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-value-32-chars-min
      PGRST_JWT_SECRET: ci-only-placeholder-secret-value-32-chars-min
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap database roles
        env:
          POSTGRES_USER: sheetbase
          POSTGRES_DB: sheetbase
          POSTGREST_AUTHENTICATOR_PASSWORD: sheetbase-ci
          MIGRATOR_PASSWORD: sheetbase-ci
          FORMULA_WRITER_PASSWORD: sheetbase-ci
          PGHOST: localhost
          PGUSER: sheetbase
          PGPASSWORD: sheetbase-ci
        run: |
          sh docker/db/init/00-roles.sh
          psql -h localhost -U sheetbase -d sheetbase -c 'ALTER USER sheetbase CREATEDB'

      - name: Run database tests
        run: pnpm test:db

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
