# Deploy the disposable, auth-free development surface. This workflow is
# deliberately separate from deploy.yml: it never reads production secrets,
# never changes the production Compose project, and is manually dispatched so
# a PR or AMP can update ordinary GitHub code review without deploying.
#
# PAUSED (PLAT-03): the GitHub account cannot run hosted-runner jobs, and the
# canonical release path is now scripts/release.sh on the VPS (pnpm
# release:local — see docs/operations/deployment.md). The trigger block below is
# commented out so this workflow cannot fire under any circumstance. To
# re-enable when hosted runners are available, uncomment the `on:` block.

name: Deploy development environment

# Push trigger stays off (PLAT-03): manual dispatch only, still gated by the
# confirm input on the job. A valid trigger block also stops GitHub emitting
# instant-failure runs for this file on every push.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build and deploy'
        required: true
        default: 'main'
      confirm:
        description: 'Type "deploy-dev" to confirm'
        required: true
        default: ''

concurrency:
  group: development-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE_NAME: ${{ github.repository }}
  POSTGREST_IMAGE_NAME: ${{ github.repository }}-postgrest

jobs:
  build:
    name: Build development images without publish credentials
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      artifact_version: ${{ steps.version.outputs.version }}
      expected_migration: ${{ steps.migration.outputs.version }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set artifact version
        id: version
        run: |
          VERSION="$(git rev-parse HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Artifact version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Node image digest
        id: node_image
        run: |
          docker pull node:26-alpine
          REF="$(docker inspect --format '{{index .RepoDigests 0}}' node:26-alpine)"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        uses: ./.github/actions/install-private
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read expected migration
        id: migration
        run: |
          VERSION="$(node --input-type=module -e "import { readJournal } from './scripts/lib/migrations.mjs'; console.log(readJournal().entries.at(-1).when)")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build app image
        env:
          SHEETBASE_NODE_IMAGE: ${{ steps.node_image.outputs.ref }}
          SHEETBASE_ARTIFACT_VERSION: ${{ steps.version.outputs.version }}
          SHEETBASE_ARTIFACT_TAG: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:dev-${{ steps.version.outputs.version }}
        run: pnpm artifact:build

      - name: Build PostgREST image
        run: |
          docker build \
            --build-arg POSTGREST_VERSION=v14.5 \
            --tag ${{ env.REGISTRY }}/${{ env.POSTGREST_IMAGE_NAME }}:v14.5 \
            docker/postgrest

      - name: Export built images
        run: |
          docker save \
            "${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:dev-${{ steps.version.outputs.version }}" \
            "${{ env.REGISTRY }}/${{ env.POSTGREST_IMAGE_NAME }}:v14.5" \
            -o "$RUNNER_TEMP/development-images.tar"

      - name: Transfer images to the isolated publisher
        uses: actions/upload-artifact@v4
        with:
          name: development-images
          path: ${{ runner.temp }}/development-images.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish development images without running repository code
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      app_image_ref: ${{ steps.app_digest.outputs.ref }}
      postgrest_image_ref: ${{ steps.postgrest_digest.outputs.ref }}
    steps:
      - name: Download built images
        uses: actions/download-artifact@v4
        with:
          name: development-images
          path: ${{ runner.temp }}/images

      - name: Load images without executing them
        run: docker load -i "$RUNNER_TEMP/images/development-images.tar"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push app image to GHCR
        id: app_digest
        run: |
          TAG="${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:dev-${{ needs.build.outputs.artifact_version }}"
          docker push "$TAG"
          REF="$(docker inspect --format '{{index .RepoDigests 0}}' "$TAG")"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Push PostgREST image to GHCR
        id: postgrest_digest
        run: |
          TAG="${{ env.REGISTRY }}/${{ env.POSTGREST_IMAGE_NAME }}:v14.5"
          docker push "$TAG"
          REF="$(docker inspect --format '{{index .RepoDigests 0}}' "$TAG")"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to development VPS
    needs: [build, publish]
    if: inputs.confirm == 'deploy-dev'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.DEV_TAILSCALE_AUTH_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_VPS_TAILSCALE_IP }}
          username: deploy
          key: ${{ secrets.DEV_VPS_SSH_PRIVATE_KEY }}
          envs: APP_IMAGE_REF,POSTGREST_IMAGE_REF,ARTIFACT_VERSION,EXPECTED_MIGRATION,DEPLOY_REF,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail

            case "$APP_IMAGE_REF" in *@sha256:*) ;; *) echo 'App image is not immutable'; exit 1 ;; esac
            case "$POSTGREST_IMAGE_REF" in *@sha256:*) ;; *) echo 'PostgREST image is not immutable'; exit 1 ;; esac

            cd /opt/sheetbase-dev
            git fetch --depth=1 origin "$DEPLOY_REF"
            git checkout --detach "$ARTIFACT_VERSION"

            set -a
            # shellcheck disable=SC1091
            . /opt/sheetbase-dev/.env.development
            set +a
            export SHEETBASE_APP_IMAGE="$APP_IMAGE_REF"
            export SHEETBASE_POSTGREST_IMAGE="$POSTGREST_IMAGE_REF"
            export SHEETBASE_ARTIFACT_VERSION="$ARTIFACT_VERSION"
            export SHEETBASE_ARTIFACT_DIGEST="${APP_IMAGE_REF##*@}"
            export SHEETBASE_EXPECTED_MIGRATION="$EXPECTED_MIGRATION"

            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            docker compose -f compose.dev.yaml --env-file /opt/sheetbase-dev/.env.development pull
            rm -rf "$DOCKER_CONFIG"
            trap - EXIT
            unset DOCKER_CONFIG GHCR_TOKEN
            docker compose -f compose.dev.yaml --env-file /opt/sheetbase-dev/.env.development up -d postgres
            docker compose -f compose.dev.yaml --env-file /opt/sheetbase-dev/.env.development --profile deployment run --rm migrate
            docker compose -f compose.dev.yaml --env-file /opt/sheetbase-dev/.env.development --profile deployment run --rm seed
            docker compose -f compose.dev.yaml --env-file /opt/sheetbase-dev/.env.development up -d postgrest app

            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3100/api/health/ready >/dev/null; then
                echo 'Development environment ready: http://127.0.0.1:3100'
                exit 0
              fi
              sleep 2
            done
            docker compose -f compose.dev.yaml --env-file /opt/sheetbase-dev/.env.development ps
            exit 1
        env:
          APP_IMAGE_REF: ${{ needs.publish.outputs.app_image_ref }}
          POSTGREST_IMAGE_REF: ${{ needs.publish.outputs.postgrest_image_ref }}
          ARTIFACT_VERSION: ${{ needs.build.outputs.artifact_version }}
          EXPECTED_MIGRATION: ${{ needs.build.outputs.expected_migration }}
          DEPLOY_REF: ${{ inputs.ref }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
