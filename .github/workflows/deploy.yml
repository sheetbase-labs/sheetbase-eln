# Deploy Sheetbase ELN to the Hostinger VPS.
#
# PAUSED (PLAT-03): the GitHub account cannot run hosted-runner jobs, and the
# canonical release path is now scripts/release.sh on the VPS (pnpm
# release:local — see docs/operations/deployment.md). The trigger block below is
# commented out so this workflow cannot fire under any circumstance. To
# re-enable when hosted runners are available, uncomment the `on:` block.
#
# Architecture:
#   1. build  — on a GitHub-hosted runner, build the app and PostgREST Docker
#               images, push them to GHCR with immutable @sha256 digests.
#   2. deploy — join the VPS's Tailscale network, SSH into the VPS, pull the
#               latest code, load production secrets, and run the existing
#               deploy controller (pnpm deploy:plan / deploy:apply).
#
# The VPS runs Docker Compose (compose.deploy.yaml) with PostgreSQL, PostgREST,
# and the app container. A Cloudflare Tunnel proxies public traffic from
# app.sheetbase.co.uk to localhost:3000 on the VPS. No inbound ports are open.
#
# Required GitHub Secrets:
#   VPS_SSH_PRIVATE_KEY    — SSH private key for the deploy user on the VPS
#   VPS_TAILSCALE_IP       — Tailscale IP of the VPS (e.g. 100.x.y.z)
#   TAILSCALE_AUTH_KEY     — Tailscale auth key for the ephemeral runner node
#   GHCR_TOKEN             — GitHub PAT with write:packages (or use GITHUB_TOKEN)
#
# Required VPS files (never committed):
#   /opt/sheetbase/.env.production — all production secrets (see docs/operations/vps-deployment.md)
#
# The VPS must have: Docker, Docker Compose, Node.js 22, pnpm, and the repo
# cloned at /opt/sheetbase with origin pointing at GitHub. See
# docs/operations/vps-deployment.md for the full VPS setup runbook.

name: Deploy to production

# on: # PAUSED — uncomment to re-enable
#   push:
#     branches: [main]
#   workflow_dispatch:
#     inputs:
#       confirm:
#         description: 'Type "deploy" to confirm'
#         required: true
#         default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE_NAME: ${{ github.repository }}
  POSTGREST_IMAGE_NAME: ${{ github.repository }}-postgrest

jobs:
  # PLAT-01 deployment gate: a release artifact is only built from a commit
  # that passes typecheck, lint, unit tests, database integration tests and a
  # production build. A failure here blocks the build and deploy jobs.
  verify:
    name: Release gate (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sheetbase
          POSTGRES_USER: sheetbase
          POSTGRES_PASSWORD: sheetbase-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sheetbase -d sheetbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sheetbase:sheetbase-ci@localhost:5432/sheetbase
      MIGRATION_DATABASE_URL: postgresql://sheetbase:sheetbase-ci@localhost:5432/sheetbase
      # PostgREST/admin URLs are not probed by the database test layer; the
      # API/browser contract layers need the pinned PostgREST service and run
      # outside this gate (documented in docs/operations/deployment.md).
      POSTGREST_URL: http://localhost:3001
      POSTGREST_ADMIN_URL: http://localhost:3002
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-value-32-chars-min
      PGRST_JWT_SECRET: ci-only-placeholder-secret-value-32-chars-min
      PGRST_DB_URI: postgresql://authenticator:sheetbase-ci@localhost:5432/sheetbase
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # The database test layer expects the same role skeleton the Compose
      # init script creates locally (migrator owns migrations, authenticator
      # fronts PostgREST). Bootstrap it in the service container, and let the
      # CI database user create the disposable sheetbase_test database.
      - name: Bootstrap database roles
        run: |
          CID=$(docker ps -q --filter ancestor=postgres:18-alpine | head -1)
          docker exec -i \
            -e POSTGRES_USER=sheetbase \
            -e POSTGRES_DB=sheetbase \
            -e POSTGREST_AUTHENTICATOR_PASSWORD=sheetbase-ci \
            -e MIGRATOR_PASSWORD=sheetbase-ci \
            -e FORMULA_WRITER_PASSWORD=sheetbase-ci \
            "$CID" sh < docker/db/init/00-roles.sh
          docker exec "$CID" psql -U sheetbase -d sheetbase \
            -c 'ALTER USER sheetbase CREATEDB'

      - name: Database integration tests
        run: pnpm test:db

      # PLAT-03 — dependency vulnerability gate: the production dependency
      # tree must be free of high+ advisories (moderates are triaged in
      # docs/operations/security.md). Visible copies run in security.yml too.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Build
        run: pnpm build

  build:
    name: Build and push images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_image_ref: ${{ steps.app_digest.outputs.ref }}
      postgrest_image_ref: ${{ steps.postgrest_digest.outputs.ref }}
      artifact_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # build-artifact.ts validates a clean worktree via git status;
          # a shallow checkout leaves .git shallow but clean.
          fetch-depth: 1

      - name: Set artifact version
        id: version
        # The immutable commit SHA is the artifact version — never a mutable
        # short SHA, branch name, or run number.
        run: |
          echo "version=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "Artifact version: ${{ github.sha }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the Node.js base image digest so build-artifact.ts can pin it.
      # The artifact builder requires NODE_IMAGE as name@sha256:digest.
      - name: Resolve Node image digest
        id: node_image
        run: |
          docker pull node:22-alpine
          REF="$(docker inspect --format '{{index .RepoDigests 0}}' node:22-alpine)"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Node image: ${REF}"

      # Build the application image using the project's artifact builder.
      # This validates a clean git worktree, records the migration version,
      # and tags the image with OCI labels for the deploy controller.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # routeTree.gen.ts is committed — do not regenerate it here. Running
      # `tsr generate` would mutate the clean checkout and break the artifact
      # build's assertCleanBuildSource check.
      - name: Build app image
        env:
          SHEETBASE_NODE_IMAGE: ${{ steps.node_image.outputs.ref }}
          SHEETBASE_ARTIFACT_VERSION: ${{ steps.version.outputs.version }}
          SHEETBASE_ARTIFACT_TAG: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${{ steps.version.outputs.version }}
        run: pnpm artifact:build

      - name: Push app image to GHCR
        id: app_digest
        run: |
          TAG="${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          docker push "$TAG"
          # Resolve the registry digest after push.
          REF="$(docker inspect --format '{{index .RepoDigests 0}}' "$TAG")"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "App image: ${REF}"

      # Build and push the PostgREST image (postgrest/postgrest:v14.5 + curl).
      - name: Build PostgREST image
        run: |
          docker build \
            --build-arg POSTGREST_VERSION=v14.5 \
            --tag ${{ env.REGISTRY }}/${{ env.POSTGREST_IMAGE_NAME }}:v14.5 \
            docker/postgrest

      - name: Push PostgREST image to GHCR
        id: postgrest_digest
        run: |
          TAG="${{ env.REGISTRY }}/${{ env.POSTGREST_IMAGE_NAME }}:v14.5"
          docker push "$TAG"
          REF="$(docker inspect --format '{{index .RepoDigests 0}}' "$TAG")"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "PostgREST image: ${REF}"

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate manual trigger confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo 'Manual trigger requires confirm="deploy"'
            exit 1
          fi

      - name: Install Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_TAILSCALE_IP }}
          username: deploy
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          # Tailscale routes the SSH connection over the tailnet; no public
          # inbound port is needed on the VPS.
          envs: APP_IMAGE_REF, POSTGREST_IMAGE_REF, ARTIFACT_VERSION,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail

            cd /opt/sheetbase

            echo "==> Pulling latest code"
            git fetch origin main
            git checkout --detach "$ARTIFACT_VERSION"

            echo "==> Installing dependencies"
            corepack enable
            corepack prepare pnpm@11.9.0 --activate
            pnpm install --frozen-lockfile

            echo "==> Loading production secrets"
            set -a
            # shellcheck disable=SC1091
            . /opt/sheetbase/.env.production
            set +a

            # Override the image references with the immutable digests from CI.
            export SHEETBASE_APP_IMAGE="$APP_IMAGE_REF"
            export SHEETBASE_POSTGREST_IMAGE="$POSTGREST_IMAGE_REF"

            echo "==> Pulling deployment images"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            docker pull "$SHEETBASE_APP_IMAGE"
            docker pull "$SHEETBASE_POSTGREST_IMAGE"
            unset GHCR_TOKEN

            # Derive the artifact digest from the app image reference.
            export SHEETBASE_ARTIFACT_DIGEST="${APP_IMAGE_REF##*@}"

            # This controller runs on the VPS, so prove the deployed artifact
            # through its loopback listener. Cloudflare is an ingress concern;
            # it must not make a healthy rollout fail while the hostname route
            # is being configured or repaired.
            export SHEETBASE_LOCAL_READINESS_URL="http://127.0.0.1:3000/api/health/ready"

            echo "==> Planning deployment"
            pnpm deploy:plan

            echo "==> Applying deployment"
            pnpm deploy:apply

            echo "==> Deployment complete"
            echo "Verify: https://app.sheetbase.co.uk/api/health/ready"
        env:
          APP_IMAGE_REF: ${{ needs.build.outputs.app_image_ref }}
          POSTGREST_IMAGE_REF: ${{ needs.build.outputs.postgrest_image_ref }}
          ARTIFACT_VERSION: ${{ needs.build.outputs.artifact_version }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
