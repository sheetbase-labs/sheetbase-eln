# PLAT-03 — pre-merge dependency audit.
#
# Catches high+ production advisories in a pull request *before* merge, so a
# vulnerable dependency cannot land and only fail the post-merge release
# gate. Deliberately minimal (install + audit, no build/tests/CodeQL) to keep
# the per-PR Actions cost low. CodeQL SAST stays on main pushes + the weekly
# schedule (security.yml) where the full toolchain cost is paid once per
# merge; the release gate in deploy.yml re-enforces the same audit on main.

name: PR dependency audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Production dependency audit (high+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
