# This workflow is read from the trusted base branch. PR source is used only
# in the secret-free image build; the publish, deploy and cleanup jobs never
# execute PR-controlled code. AMP can update ordinary PRs without holding any
# VPS, Cloudflare, GHCR, OAuth, or production credentials.
name: PR preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  REGISTRY: ghcr.io
  APP_IMAGE_NAME: ${{ github.repository }}
  POSTGREST_IMAGE_NAME: ${{ github.repository }}-postgrest

jobs:
  # This job has no packages:write permission and never logs into GHCR. A
  # compromised PR build can only affect the untrusted runner and its artifact.
  build:
    name: Build preview images (untrusted)
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_tag: ${{ steps.tags.outputs.app_tag }}
      postgrest_tag: ${{ steps.tags.outputs.postgrest_tag }}
      artifact_name: ${{ steps.artifact_name.outputs.name }}
    steps:
      - name: Checkout PR merge ref without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 1
          persist-credentials: false

      - name: Set image tags
        id: tags
        run: |
          set -euo pipefail
          suffix="pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}"
          echo "app_tag=${REGISTRY}/${APP_IMAGE_NAME}:${suffix}" >> "$GITHUB_OUTPUT"
          echo "postgrest_tag=${REGISTRY}/${POSTGREST_IMAGE_NAME}:${suffix}" >> "$GITHUB_OUTPUT"

      - name: Set artifact name
        id: artifact_name
        run: echo "name=preview-images-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Node image digest
        id: node_image
        run: |
          docker pull node:22-alpine
          REF="$(docker inspect --format '{{index .RepoDigests 0}}' node:22-alpine)"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app image
        env:
          SHEETBASE_NODE_IMAGE: ${{ steps.node_image.outputs.ref }}
          SHEETBASE_ARTIFACT_VERSION: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          SHEETBASE_ARTIFACT_TAG: ${{ steps.tags.outputs.app_tag }}
        run: pnpm artifact:build

      - name: Build PostgREST image
        run: |
          docker build \
            --build-arg POSTGREST_VERSION=v14.5 \
            --tag "${{ steps.tags.outputs.postgrest_tag }}" \
            docker/postgrest

      - name: Export images as an artifact
        run: docker save "${{ steps.tags.outputs.app_tag }}" "${{ steps.tags.outputs.postgrest_tag }}" | gzip > preview-images.tar.gz

      - name: Upload images for trusted publishing
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: preview-images.tar.gz
          if-no-files-found: error
          retention-days: 2

  # This job is trusted workflow code only. It consumes a Docker image archive
  # but does not run containers or PR scripts before logging into GHCR.
  publish:
    name: Publish immutable preview images (trusted)
    needs: build
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_image_ref: ${{ steps.app_digest.outputs.ref }}
      postgrest_image_ref: ${{ steps.postgrest_digest.outputs.ref }}
    steps:
      - name: Download untrusted build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}

      - name: Load images
        run: gunzip -c preview-images.tar.gz | docker load

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push app image
        id: app_digest
        env:
          TAG: ${{ needs.build.outputs.app_tag }}
        run: |
          docker push "$TAG"
          REF="$(docker inspect --format '{{index .RepoDigests 0}}' "$TAG")"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Push PostgREST image
        id: postgrest_digest
        env:
          TAG: ${{ needs.build.outputs.postgrest_tag }}
        run: |
          docker push "$TAG"
          REF="$(docker inspect --format '{{index .RepoDigests 0}}' "$TAG")"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy preview to VPS
    needs: publish
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_TAILSCALE_IP }}
          username: deploy
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: APP_IMAGE_REF,POSTGREST_IMAGE_REF,PR_NUMBER,BASE_DOMAIN,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/sheetbase-preview/controller
            git fetch origin main
            git checkout --detach origin/main
            corepack enable
            corepack prepare pnpm@11.9.0 --activate
            pnpm install --frozen-lockfile
            set -a
            . /opt/sheetbase-preview/.env
            set +a
            export SHEETBASE_PREVIEW_NUMBER="$PR_NUMBER"
            export SHEETBASE_PREVIEW_BASE_DOMAIN="$BASE_DOMAIN"
            export SHEETBASE_APP_IMAGE="$APP_IMAGE_REF"
            export SHEETBASE_POSTGREST_IMAGE="$POSTGREST_IMAGE_REF"
            export SHEETBASE_ARTIFACT_DIGEST="${APP_IMAGE_REF##*@}"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            docker pull "$SHEETBASE_APP_IMAGE"
            docker pull "$SHEETBASE_POSTGREST_IMAGE"
            unset GHCR_TOKEN
            pnpm preview:deploy
        env:
          APP_IMAGE_REF: ${{ needs.publish.outputs.app_image_ref }}
          POSTGREST_IMAGE_REF: ${{ needs.publish.outputs.postgrest_image_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_DOMAIN: sheetbase.co.uk
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  comment:
    name: Post preview URL
    needs: deploy
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create or update preview link comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- sheetbase-preview -->'
            const body = `${marker}\n✅ Preview deployed: https://pr-${context.payload.pull_request.number}.sheetbase.co.uk\n\nLast updated: ${new Date().toISOString()}`
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              })
            }

  cleanup:
    name: Tear down preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
    steps:
      - name: Install Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Remove preview via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_TAILSCALE_IP }}
          username: deploy
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: PR_NUMBER,BASE_DOMAIN
          script: |
            set -euo pipefail
            cd /opt/sheetbase-preview/controller
            git fetch origin main
            git checkout --detach origin/main
            corepack enable
            corepack prepare pnpm@11.9.0 --activate
            pnpm install --frozen-lockfile
            export SHEETBASE_PREVIEW_NUMBER="$PR_NUMBER"
            export SHEETBASE_PREVIEW_BASE_DOMAIN="$BASE_DOMAIN"
            pnpm preview:cleanup
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_DOMAIN: sheetbase.co.uk

  cleanup-comment:
    name: Mark preview removed on PR
    needs: cleanup
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create or update preview removal comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- sheetbase-preview -->'
            const body = `${marker}\n🧹 Preview removed: https://pr-${context.payload.pull_request.number}.sheetbase.co.uk\n\nLast updated: ${new Date().toISOString()}`
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              })
            }
