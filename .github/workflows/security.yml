# PLAT-03 — security scanning.
#
# The dependency audit runs here for visibility on `main` (plus weekly); the
# enforcing copy runs inside the deploy.yml verify job. CodeQL was removed:
# it failed on token scope in this account and SAST is not part of the merge
# gate (see docs/operations/security.md). Re-add if that changes.
#
# Deliberately not triggered on pull_request: pre-merge PR auditing is
# deferred until the account can run CI reliably (see docs/operations/security.md §4).

name: Security

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 06:20 UTC, for newly published advisories.
    - cron: '20 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Read the private @sheetbase-labs/* packages from GitHub Packages.
  packages: read

jobs:
  dependency-audit:
    name: Dependency audit (high+, prod tree)
    runs-on: ubuntu-latest
    env:
      # Reads the private @sheetbase-labs/* packages from GitHub Packages.
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: GitHub Packages auth
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
