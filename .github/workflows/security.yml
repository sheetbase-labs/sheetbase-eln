# PLAT-03 — security scanning.
#
# The dependency audit runs here for visibility on `main` (plus weekly); the
# enforcing copy runs inside the deploy.yml verify job. CodeQL was removed:
# it failed on token scope in this account and SAST is not part of the merge
# gate (see docs/operations/security.md). Re-add if that changes.
#
# Deliberately not triggered on pull_request: pre-merge PR auditing is
# deferred until the account can run CI reliably (see docs/operations/security.md §4).

name: Security

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 06:20 UTC, for newly published advisories.
    - cron: '20 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit (high+, prod tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The same install as CI: the @sheetbase-labs packages are built from the
      # public components repository, because the workflow token cannot always
      # read them from GitHub Packages.
      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
