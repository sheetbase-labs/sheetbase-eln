global_context: 'Sheetbase development knowledge. Prefer canonical/current documents over historical material. Accepted ADRs and executable server contracts take precedence when sources conflict.'

collections:
  sheetbase-knowledge:
    path: docs/knowledge
    pattern: '**/*.md'
    includeByDefault: true
    context:
      '/': 'Sheetbase canonical product, architecture, roadmaps, ADRs, historical rationale and development guidance.'
      '/history/archive/roadmap-1': 'Completed Roadmap 1 / Core Data Workspace programme.'
      '/history/archive/roadmap-2': 'Current Roadmap 2 / Product & Platform Consolidation execution corpus.'
      '/history/archive/roadmap-3': 'Strategic post-Roadmap-2 direction; not yet an implementation contract unless explicitly promoted.'
      '/roadmap-4': 'Proposed design-led roadmap: exact UI system v3 parity, sheetbase-components adoption and 86 tasks. Proposal only; NEXT.md owns assignment.'
      '/design/ui-system-v3': 'Verbatim snapshot of the current Sheetbase design system and 126 design-canvas screens; reference for Roadmap 4, not product code.'
      '/decisions': 'Accepted ADRs and cross-cutting decision context. ADRs are authoritative for durable architectural forks.'
      '/product': 'Durable Sheetbase product concepts, requirements, principles and non-goals.'
      '/architecture': 'Cross-cutting canonical architecture and scientific-data semantics.'
      '/history': 'Historical/superseded planning and conversation synthesis. Use for rationale, not current authority.'
      '/concepts': 'Historical runnable prototypes and design archaeology; not production implementation authority.'
      '/mockups': 'Historical visual product/design evidence. Binary artefacts are not indexed by the markdown collection.'
      '/references': 'External/competitor research and the lessons Sheetbase drew from it.'
      '/agent': 'Instructions for reviewing, proposing and implementing Sheetbase work.'
