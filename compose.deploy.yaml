name: sheetbase-deploy

# Production deployment compose. The deployment controller (scripts/deploy.ts)
# validates that both image variables contain @sha256 digests before invoking
# Compose. Secret values are injected into the process environment by the
# selected secret manager; this file contains none.
#
# PostgreSQL runs in the same Compose stack so all services share a private
# network. No ports are published to the host — the database is reachable only
# from the app, PostgREST, and migrate containers via the "postgres" service
# name. Public traffic arrives through the Cloudflare Tunnel, which proxies to
# the app container's port 3000 via the host's localhost.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      # Consumed by docker/db/init/00-roles.sh on first volume initialisation.
      POSTGREST_AUTHENTICATOR_PASSWORD: ${POSTGREST_AUTHENTICATOR_PASSWORD:?Set POSTGREST_AUTHENTICATOR_PASSWORD in .env.production}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Set MIGRATOR_PASSWORD in .env.production}
      FORMULA_WRITER_PASSWORD: ${FORMULA_WRITER_PASSWORD:?Set FORMULA_WRITER_PASSWORD in .env.production}
      PIPELINE_SANDBOX_PASSWORD: ${PIPELINE_SANDBOX_PASSWORD:?Set PIPELINE_SANDBOX_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgrest:
    image: ${SHEETBASE_POSTGREST_IMAGE:?Set an immutable PostgREST image reference with @sha256 digest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # authenticator is a NOINHERIT login role that can only switch to the
      # NOLOGIN request roles. Privileged database credentials never leave
      # the server side; nothing here is shipped to the browser.
      PGRST_DB_URI: ${PGRST_DB_URI:?Inject from the environment secret manager}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Inject from the environment secret manager}
      PGRST_SERVER_PORT: '3000'
      PGRST_ADMIN_SERVER_PORT: '3001'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/ready']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  app:
    image: ${SHEETBASE_APP_IMAGE:?Set an immutable application image reference with @sha256 digest}
    depends_on:
      postgrest:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SHEETBASE_ENV: ${SHEETBASE_ENV:?Set staging or production}
      SHEETBASE_SECRET_SOURCE: ${SHEETBASE_SECRET_SOURCE:-vps-local}
      SHEETBASE_ARTIFACT_DIGEST: ${SHEETBASE_ARTIFACT_DIGEST:?Set the application sha256 digest}
      DATABASE_URL: ${DATABASE_URL:?Inject from the environment secret manager}
      FORMULA_DATABASE_URL: ${FORMULA_DATABASE_URL:?Inject from the environment secret manager}
      PIPELINE_SANDBOX_DATABASE_URL: ${PIPELINE_SANDBOX_DATABASE_URL:?Inject from the environment secret manager}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Inject from the environment secret manager}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public HTTPS origin}
      # At least one way to sign in is required; deployment validation rejects
      # a release with no GitHub, OIDC or (with SMTP_HOST) emailed links.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Company SSO}
      EMAIL_LOGIN_ENABLED: ${EMAIL_LOGIN_ENABLED:-false}
      EMAIL_LOGIN_ALLOWED_DOMAINS: ${EMAIL_LOGIN_ALLOWED_DOMAINS:-}
      # Outgoing mail: sign-in links, invitations and notifications.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Inject from the environment secret manager}
      POSTGREST_URL: http://postgrest:3000
      POSTGREST_ADMIN_URL: http://postgrest:3001
      FILE_STORAGE_BACKEND: ${FILE_STORAGE_BACKEND:-local}
      FILE_STORAGE_DIR: /app/.storage/objects
      # S3-compatible file storage and off-host workspace backups. Empty means
      # unset. See docs/operations/file-storage.md and
      # docs/operations/workspace-export-and-backups.md.
      FILE_STORAGE_S3_BUCKET: ${FILE_STORAGE_S3_BUCKET:-}
      FILE_STORAGE_S3_ENDPOINT: ${FILE_STORAGE_S3_ENDPOINT:-}
      FILE_STORAGE_S3_REGION: ${FILE_STORAGE_S3_REGION:-}
      FILE_STORAGE_S3_ACCESS_KEY_ID: ${FILE_STORAGE_S3_ACCESS_KEY_ID:-}
      FILE_STORAGE_S3_SECRET_ACCESS_KEY: ${FILE_STORAGE_S3_SECRET_ACCESS_KEY:-}
      FILE_STORAGE_S3_PREFIX: ${FILE_STORAGE_S3_PREFIX:-}
      FILE_STORAGE_S3_PATH_STYLE: ${FILE_STORAGE_S3_PATH_STYLE:-}
      SHEETBASE_BACKUP_S3_BUCKET: ${SHEETBASE_BACKUP_S3_BUCKET:-}
      SHEETBASE_BACKUP_S3_ENDPOINT: ${SHEETBASE_BACKUP_S3_ENDPOINT:-}
      SHEETBASE_BACKUP_S3_REGION: ${SHEETBASE_BACKUP_S3_REGION:-}
      SHEETBASE_BACKUP_S3_ACCESS_KEY_ID: ${SHEETBASE_BACKUP_S3_ACCESS_KEY_ID:-}
      SHEETBASE_BACKUP_S3_SECRET_ACCESS_KEY: ${SHEETBASE_BACKUP_S3_SECRET_ACCESS_KEY:-}
      SHEETBASE_BACKUP_S3_PREFIX: ${SHEETBASE_BACKUP_S3_PREFIX:-}
      SHEETBASE_BACKUP_S3_PATH_STYLE: ${SHEETBASE_BACKUP_S3_PATH_STYLE:-}
      # Where members' read-only SQL logins connect (docs/operations/data-access.md).
      SHEETBASE_SQL_HOST: ${SHEETBASE_SQL_HOST:-}
      SHEETBASE_SQL_PORT: ${SHEETBASE_SQL_PORT:-5432}
      SHEETBASE_SQL_DATABASE: ${SHEETBASE_SQL_DATABASE:-sheetbase}
      # PLAT-02 metrics endpoint bearer token. Empty by default: the endpoint
      # then fails closed (404) in this deployed environment. Supply a token
      # from the secret manager to enable scraping over the private network.
      SHEETBASE_METRICS_TOKEN: ${SHEETBASE_METRICS_TOKEN:-}
      PIPELINE_PYTHON_RUNNER_URL: ${PIPELINE_PYTHON_RUNNER_URL:-}
      PIPELINE_PYTHON_RUNNER_TOKEN: ${PIPELINE_PYTHON_RUNNER_TOKEN:-}
    volumes:
      - object-storage:/app/.storage/objects
    # The public service is reached only through cloudflared on this host.
    # Bind to loopback so neither the app nor its health endpoint becomes a
    # directly reachable VPS port.
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: ${SHEETBASE_APP_IMAGE:?Set an immutable application image reference with @sha256 digest}
    profiles: [deployment]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Inject from the environment secret manager}
    command: ['node', 'scripts/migrate-once.mjs']
    restart: 'no'

volumes:
  object-storage:
  postgres-data:
