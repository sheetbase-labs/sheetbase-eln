name: sheetbase-dev

# Non-production, auth-free development stack. This file is intentionally
# separate from compose.deploy.yaml: it uses independent volumes, a separate
# host port, a separate env file and a fixed seeded development identity.
# Public access must be provided by a manually configured Cloudflare Tunnel;
# this Compose file does not expose the app beyond loopback.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sheetbase_dev}
      POSTGRES_USER: ${POSTGRES_USER:-sheetbase_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the development env file}
      POSTGREST_AUTHENTICATOR_PASSWORD: ${POSTGREST_AUTHENTICATOR_PASSWORD:?Set POSTGREST_AUTHENTICATOR_PASSWORD in the development env file}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Set MIGRATOR_PASSWORD in the development env file}
      FORMULA_WRITER_PASSWORD: ${FORMULA_WRITER_PASSWORD:?Set FORMULA_WRITER_PASSWORD in the development env file}
    volumes:
      - dev-postgres-data:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgrest:
    image: ${SHEETBASE_POSTGREST_IMAGE:?Set an immutable PostgREST image reference with @sha256 digest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI:?Set PGRST_DB_URI in the development env file}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Set PGRST_JWT_SECRET in the development env file}
      PGRST_SERVER_PORT: '3000'
      PGRST_ADMIN_SERVER_PORT: '3001'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/ready']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  app:
    image: ${SHEETBASE_APP_IMAGE:?Set an immutable application image reference with @sha256 digest}
    depends_on:
      postgrest:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SHEETBASE_ENV: development
      SHEETBASE_SECRET_SOURCE: ${SHEETBASE_SECRET_SOURCE:-vps-local}
      SHEETBASE_DEV_AUTH_FREE: 'true'
      SHEETBASE_DEV_USER_ID: ${SHEETBASE_DEV_USER_ID:-00000000-0000-4000-8000-000000000001}
      SHEETBASE_ARTIFACT_VERSION: ${SHEETBASE_ARTIFACT_VERSION:?Set the application artifact version}
      SHEETBASE_ARTIFACT_DIGEST: ${SHEETBASE_ARTIFACT_DIGEST:?Set the application sha256 digest}
      SHEETBASE_EXPECTED_MIGRATION: ${SHEETBASE_EXPECTED_MIGRATION:?Set the expected migration version}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the development env file}
      FORMULA_DATABASE_URL: ${FORMULA_DATABASE_URL:?Set FORMULA_DATABASE_URL in the development env file}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-insecure-auth-secret-replace-me-0123456789}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://dev.sheetbase.co.uk}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Set PGRST_JWT_SECRET in the development env file}
      POSTGREST_URL: http://postgrest:3000
      POSTGREST_ADMIN_URL: http://postgrest:3001
      FILE_STORAGE_BACKEND: local
      FILE_STORAGE_DIR: /app/.storage/objects
    volumes:
      - dev-object-storage:/app/.storage/objects
    ports:
      - '127.0.0.1:3100:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: ${SHEETBASE_APP_IMAGE:?Set an immutable application image reference with @sha256 digest}
    profiles: [deployment]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL in the development env file}
    command: ['./node_modules/.bin/drizzle-kit', 'migrate']
    restart: 'no'

  seed:
    image: ${SHEETBASE_APP_IMAGE:?Set an immutable application image reference with @sha256 digest}
    profiles: [deployment]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the development env file}
      FILE_STORAGE_DIR: /app/.storage/objects
    volumes:
      - dev-object-storage:/app/.storage/objects
    command: ['node', '--import', 'tsx', 'src/db/seed/run.ts', '--demo']
    restart: 'no'

volumes:
  dev-postgres-data:
    name: sheetbase-dev-postgres-data
  dev-object-storage:
    name: sheetbase-dev-object-storage
