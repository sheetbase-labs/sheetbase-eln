name: ${SHEETBASE_PREVIEW_PROJECT:?Set SHEETBASE_PREVIEW_PROJECT}

# One disposable stack per pull request. Secrets come only from the VPS
# preview environment and are never committed here.
services:
  postgres:
    image: ${SHEETBASE_POSTGRES_IMAGE:-postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the VPS preview environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the VPS preview environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VPS preview environment}
      POSTGREST_AUTHENTICATOR_PASSWORD: ${POSTGREST_AUTHENTICATOR_PASSWORD:?Set POSTGREST_AUTHENTICATOR_PASSWORD in the VPS preview environment}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Set MIGRATOR_PASSWORD in the VPS preview environment}
      FORMULA_WRITER_PASSWORD: ${FORMULA_WRITER_PASSWORD:?Set FORMULA_WRITER_PASSWORD in the VPS preview environment}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: '0.25'
    pids_limit: 128
    restart: unless-stopped

  postgrest:
    image: ${SHEETBASE_POSTGREST_IMAGE:?Set an immutable PostgREST image reference with @sha256 digest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgresql://authenticator:${POSTGREST_AUTHENTICATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Set PGRST_JWT_SECRET in the VPS preview environment}
      PGRST_SERVER_PORT: '3000'
      PGRST_ADMIN_SERVER_PORT: '3001'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/ready']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 128m
    cpus: '0.25'
    pids_limit: 64
    restart: unless-stopped

  app:
    image: ${SHEETBASE_APP_IMAGE:?Set an immutable application image reference with @sha256 digest}
    depends_on:
      postgrest:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SHEETBASE_ENV: preview
      SHEETBASE_SECRET_SOURCE: vps-local
      SHEETBASE_PREVIEW_DEMO: 'true'
      SHEETBASE_ARTIFACT_DIGEST: ${SHEETBASE_ARTIFACT_DIGEST:?Set the application sha256 digest}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql://migrator:${MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FORMULA_DATABASE_URL: postgresql://formula_runtime:${FORMULA_WRITER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in the VPS preview environment}
      BETTER_AUTH_URL: ${SHEETBASE_PREVIEW_PUBLIC_ORIGIN:?Set the preview HTTPS origin}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Set PGRST_JWT_SECRET in the VPS preview environment}
      POSTGREST_URL: http://postgrest:3000
      POSTGREST_ADMIN_URL: http://postgrest:3001
      FILE_STORAGE_BACKEND: local
      FILE_STORAGE_DIR: /app/.storage/objects
    volumes:
      - object-storage:/app/.storage/objects
    ports:
      - '127.0.0.1:${SHEETBASE_PREVIEW_APP_PORT:?Set the PR-specific loopback port}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: '0.5'
    pids_limit: 256
    tmpfs:
      - /tmp
    restart: unless-stopped

  migrate:
    image: ${SHEETBASE_APP_IMAGE:?Set an immutable application image reference with @sha256 digest}
    profiles: [deployment]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgresql://migrator:${MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ['./node_modules/.bin/drizzle-kit', 'migrate']
    mem_limit: 256m
    cpus: '0.25'
    pids_limit: 128
    restart: 'no'

  seed:
    image: ${SHEETBASE_APP_IMAGE:?Set an immutable application image reference with @sha256 digest}
    profiles: [deployment]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql://migrator:${MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGRST_DB_URI: postgresql://authenticator:${POSTGREST_AUTHENTICATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SHEETBASE_ENV: preview
      SHEETBASE_PREVIEW_DEMO: 'true'
      FILE_STORAGE_DIR: /app/.storage/objects
    volumes:
      - object-storage:/app/.storage/objects
    command: ['node', '--import', 'tsx', 'src/db/seed/run.ts', '--demo']
    mem_limit: 256m
    cpus: '0.25'
    pids_limit: 128
    restart: 'no'

volumes:
  object-storage:
  postgres-data:
