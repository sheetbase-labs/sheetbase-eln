name: sheetbase

# All credentials and secrets come from .env.local (copy .env.example first).
# The pnpm services:* scripts pass --env-file .env.local automatically.
# Running docker compose directly requires --env-file .env.local.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sheetbase}
      POSTGRES_USER: ${POSTGRES_USER:-sheetbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
      # Consumed by docker/db/init/00-roles.sh on first volume initialisation.
      POSTGREST_AUTHENTICATOR_PASSWORD: ${POSTGREST_AUTHENTICATOR_PASSWORD:?Set POSTGREST_AUTHENTICATOR_PASSWORD in .env.local}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Set MIGRATOR_PASSWORD in .env.local}
      FORMULA_WRITER_PASSWORD: ${FORMULA_WRITER_PASSWORD:?Set FORMULA_WRITER_PASSWORD in .env.local}
      PIPELINE_SANDBOX_PASSWORD: ${PIPELINE_SANDBOX_PASSWORD:?Set PIPELINE_SANDBOX_PASSWORD in .env.local}
    # Local development and the test layers only: more connection slots for the
    # parallel suites, and durability settings that trade crash-safety for speed
    # on a disposable database (the shared environments never use this file).
    command:
      [
        'postgres',
        '-c',
        'max_connections=300',
        '-c',
        'synchronous_commit=off',
        '-c',
        'fsync=off',
        '-c',
        'full_page_writes=off',
      ]
    # Localhost only: the database is not reachable from other machines.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    build:
      context: ./docker/postgrest
      args:
        POSTGREST_VERSION: v14.5
    image: sheetbase/postgrest:v14.5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # authenticator is a NOINHERIT login role that can only switch to the
      # NOLOGIN request roles. Privileged database credentials never leave
      # the server side; nothing here is shipped to the browser.
      PGRST_DB_URI: ${PGRST_DB_URI:?Set PGRST_DB_URI in .env.local (host must be "postgres", the compose service name)}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Set PGRST_JWT_SECRET in .env.local (32+ characters)}
      PGRST_SERVER_PORT: '3000'
      PGRST_ADMIN_SERVER_PORT: '3001'
    # 3001: REST API. 3002: admin server (live/ready), health checks only.
    ports:
      - '127.0.0.1:${POSTGREST_PORT:-3001}:3000'
      - '127.0.0.1:${POSTGREST_ADMIN_PORT:-3002}:3001'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/ready']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # S3-compatible object storage for local development, next to Postgres. Files
  # (FILE_STORAGE_BACKEND=s3) and scheduled backups (SHEETBASE_BACKUP_S3_*) can
  # point here, which exercises the same code path as AWS S3, R2 or B2. Not
  # started for the test layers, which use the database for files.
  minio:
    # Phlo's maintained MinIO build (the upstream minio/minio image is deprecated).
    image: ghcr.io/phlohouse/phlo-minio:0.17.2
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sheetbase}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sheetbase-minio-dev}
    # Localhost only. 9000: S3 API. 9001: web console.
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/bitnami/minio/data

  # Creates the two buckets once MinIO answers, then exits. The image carries
  # the mc client as well as the server.
  minio-setup:
    image: ghcr.io/phlohouse/phlo-minio:0.17.2
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sheetbase}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sheetbase-minio-dev}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done &&
        mc mb --ignore-existing local/sheetbase-files local/sheetbase-backups
    restart: 'no'

volumes:
  postgres-data:
  minio-data:
