name: sheetbase

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sheetbase
      POSTGRES_USER: sheetbase
      POSTGRES_PASSWORD: sheetbase
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sheetbase -d sheetbase']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
