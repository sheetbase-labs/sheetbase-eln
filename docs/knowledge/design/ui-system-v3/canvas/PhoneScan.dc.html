<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<div data-theme="{{theme}}" class="sb-root shell" style="width: 390px; height: 844px">
<div style="display: flex; flex-direction: column; height: 100%; background: var(--bg)"><header class="phone-bar"><a href="PhoneHome.dc.html" class="btn ib" aria-label="Back" style="width: 44px; height: 44px"><x-import component-from-global-scope="Sheetbase.Icon" name="arrowLeft" size="20"></x-import></a><h1 class="h" style="font-size: 17px; font-weight: 600; margin: 0; flex-grow: 1">Scan</h1></header><main id="main" style="flex-grow: 1; display: flex; flex-direction: column; background: #0B0E12; position: relative; overflow: hidden"><div role="img" aria-label="Camera view: a tube label with a square code is inside the frame" style="flex-grow: 1; position: relative; display: flex; align-items: center; justify-content: center"><div style="width: 230px; height: 150px; border-radius: 10px; background: #E9EAEC; display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 14px; align-items: center; transform: rotate(-4deg); box-shadow: 0 10px 30px rgba(0,0,0,.5)"><svg width="70" height="70" viewBox="0 0 7 7" aria-hidden="true" shape-rendering="crispEdges"><path d="M0 0h3v3H0zM4 0h3v3H4zM0 4h3v3H0zM4 4h1v1H4zM6 4h1v1H6zM5 5h1v1H5zM4 6h1v1H4zM6 6h1v1H6z" fill="#0F141C"></path><path d="M1 1h1v1H1zM5 1h1v1H5zM1 5h1v1H1z" fill="#E9EAEC"></path></svg><div style="font-family: var(--font-mono); font-size: 12px; line-height: 18px; color: #0F141C">SMP-2231<br>HL-0934<br>2–8 °C</div></div><div aria-hidden="true" style="position: absolute; width: 270px; height: 200px; border: 3px solid #4C9BFF; border-radius: 16px"></div></div><div style="background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 12px; border-radius: 16px 16px 0 0"><div style="display: flex; align-items: center; gap: 12px"><span style="color: var(--success)"><x-import component-from-global-scope="Sheetbase.Icon" name="check" size="20"></x-import></span><div style="flex-grow: 1"><div class="mono muted">SMP-2231</div><div style="font-weight: 600; font-size: 15px">Harvest lot HL-0934</div><div class="muted" style="font-size: 12px">Released · 4,600 mL · CR-1, shelf 3</div></div></div><a href="PhoneSample.dc.html" class="btn btn-p btn-l">Open sample</a><div style="display: flex; gap: 8px"><a href="PhoneWithdraw.dc.html" class="btn btn-l" style="flex: 1">Withdraw</a><a href="PhoneReading.dc.html" class="btn btn-l" style="flex: 1">Record reading</a></div><div class="muted" style="font-size: 12px; text-align: center">Can’t scan? <a href="PhoneSample.dc.html">Type the ID</a> · Last scan <a href="RecordPhone.dc.html" class="mono">CB-0012</a></div></div></main><nav class="phone-tabs" aria-label="Main" style="grid-template-columns: repeat(3, minmax(0, 1fr))"><a href="PhoneHome.dc.html"><x-import component-from-global-scope="Sheetbase.Icon" name="calendar" size="22"></x-import>Today</a><a href="PhoneScan.dc.html" class="on" aria-current="page"><x-import component-from-global-scope="Sheetbase.Icon" name="scan" size="22"></x-import>Scan</a><a href="PhoneInbox.dc.html"><x-import component-from-global-scope="Sheetbase.Icon" name="inbox" size="22"></x-import>Inbox</a></nav><sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast-stack" style="bottom: 90px"><x-import component-from-global-scope="Sheetbase.Toast" action="{{toastAction}}" on-action="{{dismissToast}}">{{toastMsg}}</x-import></div></sc-if></div>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"auto"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() {
const T = window.Sheetbase && window.Sheetbase.theme;
if (T) this._off = T.subscribe(() => this.forceUpdate());
this.forceUpdate();
}
componentWillUnmount() { if (this._off) this._off(); clearTimeout(this._tt); }
renderVals() {
const st = this.state || {};
const SB = window.Sheetbase || {};
const T = SB.theme;
const theme = T ? T.resolved(this.props.theme) : (this.props.theme === 'dark' ? 'dark' : 'light');
const menu = st.menu || null;
const open = (k) => () => this.setState({ menu: menu === k ? null : k });
const toast = (msg, action, tone) => () => {
clearTimeout(this._tt);
this.setState({ menu: null, toast: { msg, action: action || '', tone: tone || '' } });
this._tt = setTimeout(() => this.setState({ toast: null }), 6000);
};
const tabs = (g, keys, def) => {
const cur = st['t_' + g] || def;
const o = { now: cur };
keys.forEach((k) => { o[k] = { cls: k === cur ? 'on' : '', sel: String(k === cur), on: k === cur, off: k !== cur, pick: () => this.setState({ ['t_' + g]: k }) }; });
return o;
};
const allRead = !!st.read;
const v = {
theme,
themeIcon: theme === 'dark' ? 'sun' : 'moon',
themeLabel: theme === 'dark' ? 'Switch to light' : 'Switch to dark',
toggleTheme: () => { if (T) T.set(theme === 'dark' ? 'light' : 'dark'); this.forceUpdate(); },
appearance: T ? T.get() : 'light',
setAppearance: (x) => { if (T) T.set(x); this.forceUpdate(); },
m: { any: !!menu, ws: menu === 'ws', new: menu === 'new', notif: menu === 'notif', account: menu === 'account', row: menu === 'row', more: menu === 'more' },
exp: { ws: String(menu === 'ws'), new: String(menu === 'new'), notif: String(menu === 'notif'), account: String(menu === 'account'), row: String(menu === 'row'), more: String(menu === 'more') },
open: { ws: open('ws'), new: open('new'), notif: open('notif'), account: open('account'), row: open('row'), more: open('more') },
close: () => this.setState({ menu: null }),
allRead, unread: !allRead,
markRead: () => this.setState({ read: true }),
bellClass: allRead ? '' : 'ib-badge',
bellLabel: allRead ? 'Notifications' : 'Notifications, 4 unread',
hasToast: !!st.toast,
toastMsg: st.toast ? st.toast.msg : '',
toastAction: st.toast ? st.toast.action : '',
toastTone: st.toast ? st.toast.tone : '',
dismissToast: () => { clearTimeout(this._tt); this.setState({ toast: null }); },
onSaved: toast('Changes saved', 'Undo'),
onCopied: toast('Link copied'),
onSent: toast('Request sent'),
onExported: toast('Export started. You will get a link when it is ready.'),
onAdded: toast('Added'),
onSubmitted: toast('Submitted for review. Your reviewer has been notified.'),
onPrinted: toast('Sent to label printer ZD-2 (Lab 2)'),
onRerun: toast('Running\u2026 results update when it finishes'),
onRemoved: toast('Removed', 'Undo'),
onFailed: toast('Couldn’t save. Check your connection and try again.', 'Retry', 'bad')
};
return v;
}
}
</script>
</body>
</html>
