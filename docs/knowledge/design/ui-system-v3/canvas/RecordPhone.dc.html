<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record on phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/sheetbase/components/bundle.css">
<script src="ds/sheetbase/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:var(--bg)}

</style>
</helmet>
<div data-theme="{{theme}}" class="sb-root shell" style="width: 390px; height: 844px">
<div style="display: flex; flex-direction: column; height: 100%; background: var(--bg)"><header class="phone-bar"><a href="PhoneScan.dc.html" class="btn ib" aria-label="Back" style="width: 44px; height: 44px"><x-import component-from-global-scope="Sheetbase.Icon" name="arrowLeft" size="20"></x-import></a><h1 class="h" style="font-size: 17px; font-weight: 600; margin: 0; flex-grow: 1">Cell bank</h1></header><div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column"><div style="padding: 14px 16px 10px"><span class="mono muted">CB-0012</span><div class="h" style="font-size: 20px; font-weight: 600">HEK293 WCB lot 3</div><div class="muted" style="font-size: 12px">Scanned 11:02 · model Cell bank v4</div></div><div class="row-l" style="justify-content: space-between; min-height: 48px"><span class="muted">Status</span><span style="text-align: right"><x-import component-from-global-scope="Sheetbase.Status" tone="ok">Released</x-import></span></div><div class="row-l" style="justify-content: space-between; min-height: 48px"><span class="muted">Cell line</span><span style="text-align: right">HEK293 · P12</span></div><div class="row-l" style="justify-content: space-between; min-height: 48px"><span class="muted">Vials left</span><span style="text-align: right">31 of 50</span></div><div class="row-l" style="justify-content: space-between; min-height: 48px"><span class="muted">Location</span><span style="text-align: right">LN2-2 · rack C · box 4</span></div><div class="row-l" style="justify-content: space-between; min-height: 48px"><span class="muted">Parent</span><span style="text-align: right">CB-0010 HEK293 MCB</span></div><div class="row-l" style="justify-content: space-between; min-height: 48px"><span class="muted">Mycoplasma</span><span style="text-align: right"><span class="muted">Not recorded</span></span></div><div style="padding: 16px; display: flex; flex-direction: column; gap: 8px"><x-import component-from-global-scope="Sheetbase.Button" variant="primary" size="lg" href="PhoneWithdraw.dc.html">Withdraw vials</x-import><x-import component-from-global-scope="Sheetbase.Button" size="lg" on-click="{{onSaved}}">Record mycoplasma result</x-import></div></div><nav class="phone-tabs" aria-label="Main" style="grid-template-columns: repeat(3, minmax(0, 1fr))"><a href="PhoneHome.dc.html"><x-import component-from-global-scope="Sheetbase.Icon" name="calendar" size="22"></x-import>Today</a><a href="PhoneScan.dc.html" class="on" aria-current="page"><x-import component-from-global-scope="Sheetbase.Icon" name="scan" size="22"></x-import>Scan</a><a href="PhoneInbox.dc.html"><x-import component-from-global-scope="Sheetbase.Icon" name="inbox" size="22"></x-import>Inbox</a></nav><sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast-stack" style="bottom: 90px"><x-import component-from-global-scope="Sheetbase.Toast" action="{{toastAction}}" on-action="{{dismissToast}}">{{toastMsg}}</x-import></div></sc-if></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"auto"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() {
const T = window.Sheetbase && window.Sheetbase.theme;
if (T) this._off = T.subscribe(() => this.forceUpdate());
this.forceUpdate();
}
componentWillUnmount() { if (this._off) this._off(); clearTimeout(this._tt); }
renderVals() {
const st = this.state || {};
const SB = window.Sheetbase || {};
const T = SB.theme;
const theme = T ? T.resolved(this.props.theme) : (this.props.theme === 'dark' ? 'dark' : 'light');
const menu = st.menu || null;
const open = (k) => () => this.setState({ menu: menu === k ? null : k });
const toast = (msg, action, tone) => () => {
clearTimeout(this._tt);
this.setState({ menu: null, toast: { msg, action: action || '', tone: tone || '' } });
this._tt = setTimeout(() => this.setState({ toast: null }), 6000);
};
const tabs = (g, keys, def) => {
const cur = st['t_' + g] || def;
const o = { now: cur };
keys.forEach((k) => { o[k] = { cls: k === cur ? 'on' : '', sel: String(k === cur), on: k === cur, off: k !== cur, pick: () => this.setState({ ['t_' + g]: k }) }; });
return o;
};
const allRead = !!st.read;
const v = {
theme,
themeIcon: theme === 'dark' ? 'sun' : 'moon',
themeLabel: theme === 'dark' ? 'Switch to light' : 'Switch to dark',
toggleTheme: () => { if (T) T.set(theme === 'dark' ? 'light' : 'dark'); this.forceUpdate(); },
appearance: T ? T.get() : 'light',
setAppearance: (x) => { if (T) T.set(x); this.forceUpdate(); },
m: { any: !!menu, ws: menu === 'ws', new: menu === 'new', notif: menu === 'notif', account: menu === 'account', row: menu === 'row', more: menu === 'more' },
exp: { ws: String(menu === 'ws'), new: String(menu === 'new'), notif: String(menu === 'notif'), account: String(menu === 'account'), row: String(menu === 'row'), more: String(menu === 'more') },
open: { ws: open('ws'), new: open('new'), notif: open('notif'), account: open('account'), row: open('row'), more: open('more') },
close: () => this.setState({ menu: null }),
allRead, unread: !allRead,
markRead: () => this.setState({ read: true }),
bellClass: allRead ? '' : 'ib-badge',
bellLabel: allRead ? 'Notifications' : 'Notifications, 4 unread',
hasToast: !!st.toast,
toastMsg: st.toast ? st.toast.msg : '',
toastAction: st.toast ? st.toast.action : '',
toastTone: st.toast ? st.toast.tone : '',
dismissToast: () => { clearTimeout(this._tt); this.setState({ toast: null }); },
onSaved: toast('Changes saved', 'Undo'),
onCopied: toast('Link copied'),
onSent: toast('Request sent'),
onExported: toast('Export started. You will get a link when it is ready.'),
onAdded: toast('Added'),
onSubmitted: toast('Submitted for review. Your reviewer has been notified.'),
onPrinted: toast('Sent to label printer ZD-2 (Lab 2)'),
onRerun: toast('Running\u2026 results update when it finishes'),
onRemoved: toast('Removed', 'Undo'),
onFailed: toast('Couldn’t save. Check your connection and try again.', 'Retry', 'bad')
};
return v;
}
}
</script>
</body>
</html>
