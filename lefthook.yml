# Git hooks. Install the tools with `mise install`; `pnpm install` then runs
# `lefthook install`. Pre-commit checks only the staged files and pre-push
# runs the checks that need the whole tree; CI runs everything again.
glob_matcher: doublestar

pre-commit:
  piped: true
  jobs:
    - name: secrets
      run: gitleaks git --pre-commit --staged --redact --no-banner

    - name: migrations
      glob: 'drizzle/**'
      run: node scripts/check-staged-migrations.mjs {staged_files}

    - name: prettier
      glob:
        - '{src,scripts,perf,docs}/**/*.{ts,tsx,mts,js,jsx,mjs,cjs,json,css,md,yml,yaml}'
        - '*.{ts,json,md,yaml}'
        - 'prettier.config.js'
        - 'tools/oxlint/README.md'
      run: bunx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: oxlint
      glob:
        - '{src,scripts,perf}/**/*.{ts,tsx,mts,js,jsx,mjs,cjs}'
        - '{vite,vitest,drizzle}.config.ts'
      run: bunx oxlint --type-aware --deny-warnings --report-unused-disable-directives --format=agent {staged_files}

    - name: copy and colours
      glob: 'src/**/*.{ts,tsx,css}'
      run: bunx tsx scripts/check-copy.mts && bunx tsx scripts/check-colours.mts

    - name: react doctor
      glob: 'src/**/*.{ts,tsx}'
      run: bunx react-doctor . --staged --blocking warning --no-score --no-telemetry --yes

commit-msg:
  jobs:
    # Strips assistant credit, then refuses a non-conventional subject.
    - name: commit rules
      run: node scripts/check-commits.mjs --message {1}

pre-push:
  parallel: true
  jobs:
    # Authors, subjects and credit on every commit not yet on main, plus the
    # branch name (no claude/).
    - name: commit rules
      run: PR_HEAD="$(git branch --show-current)" node scripts/check-commits.mjs origin/main

    - name: migrations
      run: node scripts/check-migrations.mjs origin/main

    - name: typecheck
      # Same heap as CI; the default runs out of memory.
      run: NODE_OPTIONS=--max-old-space-size=8192 pnpm typecheck
