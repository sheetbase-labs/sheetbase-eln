[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sheetbase"
version = "0.1.0"
description = "Python SDK for the Sheetbase ELN public API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Gareth Price", email = "garethprice@me.com" }]
keywords = ["sheetbase", "eln", "lab notebook", "biopharma", "scientific data"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "httpx>=0.27",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/phlohouse/sheetbase-eln"
Documentation = "https://github.com/phlohouse/sheetbase-eln/tree/main/sdks/python"

[tool.hatch.build.targets.wheel]
packages = ["src/sheetbase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
